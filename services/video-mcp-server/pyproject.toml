[project]
name = "verdantflare-video-mcp-server"
version = "0.10.12"
description = "VerdantFlare video-mcp-server service"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.1.0",
  "httpx==0.28.1",
  "boto3==1.40.76",
  "pydantic==2.12.5",
  "uvicorn==0.40.0",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["app"]
namespaces = false

[project.optional-dependencies]
browser = ["playwright==1.62.0"]

[dependency-groups]
# Processing integration uses the Runtime FastAPI stack, not the MCP web server.
processing = ["boto3==1.40.76"]
