[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verdantflare-video-h3-latent-upscaler"
version = "0.1.1"
description = "Same-node task-based H3 latent post-processing"
requires-python = ">=3.12"
dependencies = ["safetensors==0.8.0", "numpy==2.5.2", "fastapi==0.135.1", "uvicorn==0.40.0"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
test = ["torch", "safetensors>=0.4.2", "numpy>=1.25", "httpx>=0.27"]
