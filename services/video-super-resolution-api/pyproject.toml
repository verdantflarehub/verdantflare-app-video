[project]
name = "verdantflare-video-super-resolution-api"
version = "0.1.3"
description = "VerdantFlare video-super-resolution-api service"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.12.5",
  "uvicorn==0.40.0",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "torch==2.3.0",
  "torchvision==0.18.0",
  "einops==0.7.0",
  "omegaconf==2.3.0",
  "diffusers==0.29.1",
  "rotary-embedding-torch==0.5.3",
  "transformers==4.38.2",
  "huggingface-hub==0.23.4",
  "Pillow==11.1.0",
  "mediapy==1.2.0",
  "av==12.3.0",
  "ninja==1.11.1.1",
  "packaging==24.2",
  "tqdm==4.67.1",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Docker and tests run the explicitly copied source via PYTHONPATH.
py-modules = []

[dependency-groups]
test = [
  "fastapi==0.115.6",
  "pydantic==2.12.5",
  "uvicorn==0.40.0",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "httpx==0.28.1",
]

# CPU engine tests install torch separately from the CPU wheel index.
engine-test = ["rotary-embedding-torch==0.5.3", "einops==0.7.0"]
cpu-torch = ["torch==2.3.0"]
