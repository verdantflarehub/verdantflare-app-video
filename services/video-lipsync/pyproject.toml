[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verdantflare-video-lipsync"
version = "0.1.5"
description = "5090 asynchronous video lip-sync runtime backed by ByteDance LatentSync 1.6"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.40.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
