[project]
name = "verdantflare-video-depth-anything-api"
version = "0.2.2"
description = "VerdantFlare video-depth-anything-api service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "opencv-python-headless==4.10.0.84",
  "numpy==2.2.2",
  "Pillow==11.1.0",
  "einops==0.8.1",
  "tqdm==4.67.1",
  "easydict==1.13",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Docker and tests run the explicitly copied source via PYTHONPATH.
py-modules = []

[project.optional-dependencies]
test = ["httpx==0.28.1"]
