[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verdantflare-video-minimax-h3-regenerate-2k"
version = "0.1.0"
description = "Open-H3-Regenerate-2K-IC MiniMax H3 2K latent regeneration runtime"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.40.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
