[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verdantflare-video-minimax-h3-api"
version = "0.6.0"
description = "Huobao v2 video compatibility bridge through VerdantFlare Studio MCP"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.40.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
