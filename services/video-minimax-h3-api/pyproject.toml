[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verdantflare-video-minimax-h3-api"
version = "0.5.1"
description = "Authenticated 5090 API facade for the MiniMax H3 Singularity runtime"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.40.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
