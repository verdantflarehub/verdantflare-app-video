name: Video H3 Latent Upscaler API

on:
  push:
    branches: [release]
    paths:
      - services/video-h3-latent-upscaler-api/**
      - .github/workflows/video-h3-latent-upscaler-api.yml

permissions:
  contents: read

concurrency:
  group: video-h3-latent-upscaler-api-release
  cancel-in-progress: false

env:
  SERVICE: video-h3-latent-upscaler-api
  VERSION: 0.1.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==25.3
      - run: python -m pip install services/${SERVICE} httpx torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip check
      - run: PYTHONPATH=services/${SERVICE}/src python -m unittest discover -s services/${SERVICE}/tests -v
      - run: python -m compileall -q services/${SERVICE}/src
  build:
    needs: check
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          echo "registry_endpoint=${registry_endpoint}" >> "$GITHUB_OUTPUT"
          echo "name=${registry_endpoint}/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
          echo "version=${SERVICE}-v${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing image tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" > /tmp/image-inspect.log 2>&1; then
            echo "Refusing to overwrite an existing release"
            exit 1
          fi
          grep -Eqi 'manifest unknown|not found' /tmp/image-inspect.log || { echo "Registry preflight failed"; exit 1; }
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: services/${{ env.SERVICE }}
          file: services/${{ env.SERVICE }}/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
      - name: Verify published manifest
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
