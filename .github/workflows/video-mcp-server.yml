name: Video MCP Server

on:
  push:
    branches: [release]
    paths:
      - services/video-mcp-server/**
      - .github/workflows/video-mcp-server.yml
permissions:
  contents: read
concurrency:
  group: video-mcp-server-release
  cancel-in-progress: false
env:
  SERVICE: video-mcp-server
  VERSION: 0.9.7
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: services/video-mcp-server
        run: |
          python3 -m pip install ./services/${SERVICE}
          python3 -m unittest discover -s services/${SERVICE}/tests -v
          node --check services/${SERVICE}/verdantflare_video_mcp/static/dashboard.js
          node --check services/${SERVICE}/verdantflare_video_mcp/static/resources.js
          node --check services/${SERVICE}/verdantflare_video_mcp/static/task-detail.js
      - name: Browser integration
        env:
          PYTHONPATH: services/video-mcp-server
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install "./services/${SERVICE}[browser]"
          python3 -m playwright install --with-deps chromium
          python3 services/${SERVICE}/tests/browser_dashboard.py
  processing-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip==25.3
      - run: python -m pip install --group services/video-super-resolution-api/pyproject.toml:test
      - run: python -m pip check
      - run: PYTHONPATH=services/video-super-resolution-api:services/video-frame-interpolation-api:services/video-mcp-server python -m unittest discover -s services/video-mcp-server/integration -v
  build:
    needs: [check, processing-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          set -euo pipefail
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          test -n "${registry_endpoint}"
          echo "registry_endpoint=${registry_endpoint}" >> "$GITHUB_OUTPUT"
          echo "name=${registry_endpoint}/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
          echo "version=${SERVICE}-v${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing image tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" > /tmp/image-inspect.log 2>&1; then
            echo "Refusing to overwrite an existing release"
            exit 1
          fi
          grep -Eqi 'manifest unknown|not found' /tmp/image-inspect.log || { echo "Registry preflight failed"; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}

# Registered on video repository default branch
