name: Video Depth Anything API

on:
  push:
    branches: [release]
    paths:
      - services/video-depth-anything-api/**
      - .github/workflows/video-depth-anything-api.yml

permissions:
  contents: read

concurrency:
  group: video-depth-anything-api-release
  cancel-in-progress: false

env:
  SERVICE: video-depth-anything-api
  VERSION: 0.2.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/${SERVICE}/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install httpx==0.28.1
      - run: PYTHONPATH=services/${SERVICE} python -m unittest discover -s services/${SERVICE}/tests -v
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          echo "registry_endpoint=${registry_endpoint}" >> "$GITHUB_OUTPUT"
          echo "name=${registry_endpoint}/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
          echo "version=${SERVICE}-v${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing image tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" > /tmp/image-inspect.log 2>&1; then
            echo "Refusing to overwrite an existing release"
            exit 1
          fi
          grep -Eqi 'manifest unknown|not found' /tmp/image-inspect.log || { echo "Registry preflight failed"; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
