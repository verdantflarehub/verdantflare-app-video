name: H3-Sol Resident Service

on:
  push:
    branches: [dev, release]
    paths:
      - services/video-minimax-h3-sol/**
      - .github/workflows/video-minimax-h3-sol.yml
  pull_request:
    paths:
      - services/video-minimax-h3-sol/**
      - .github/workflows/video-minimax-h3-sol.yml
permissions:
  contents: read
concurrency:
  group: video-minimax-h3-sol-${{ github.ref }}
  cancel-in-progress: false
env:
  SERVICE: video-minimax-h3-sol
  VERSION: 0.2.0
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: CPU contract and allocation tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: services/video-minimax-h3-sol
        run: |
          python3 -m unittest discover -s services/${SERVICE}/tests -v
          python3 -m compileall -q services/${SERVICE}
      - name: Verify upstream and sealed patches
        run: |
          set -euo pipefail
          git init /tmp/sol-upstream
          git -C /tmp/sol-upstream remote add origin https://github.com/NVlabs/Sana.git
          git -C /tmp/sol-upstream sparse-checkout set models/minimax_h3/Sol-H3
          git -C /tmp/sol-upstream fetch --depth=1 --filter=blob:none origin 2936c47637380842aaa4a4488fac5006cc542b70
          git -C /tmp/sol-upstream checkout --detach FETCH_HEAD
          python3 services/${SERVICE}/verify-source.py /tmp/sol-upstream/models/minimax_h3/Sol-H3
          python3 services/${SERVICE}/prepare-patched-source.py --source /tmp/sol-upstream/models/minimax_h3/Sol-H3 --output /tmp/sol-patched
          python3 -m compileall -q /tmp/sol-patched
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk for CUDA image on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          set -euo pipefail
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          test -n "${registry_endpoint}"
          echo "registry_endpoint=${registry_endpoint}" >> "$GITHUB_OUTPUT"
          echo "name=${registry_endpoint}/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
          echo "version=${SERVICE}-v${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Reject an existing version
        run: '! docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" >/dev/null 2>&1'
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: services/${{ env.SERVICE }}
          file: services/${{ env.SERVICE }}/Dockerfile.resident
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
      - name: Verify published manifest
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
