name: Video Super Resolution API

on:
  push:
    branches: [release]
    paths:
      - services/video-super-resolution-api/**
      - .github/workflows/video-super-resolution-api.yml

permissions:
  contents: read

concurrency:
  group: video-super-resolution-api-release
  cancel-in-progress: false

env:
  SERVICE: video-super-resolution-api
  VERSION: 0.1.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/video-super-resolution-api/requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip check
      - run: PYTHONPATH=services/video-super-resolution-api:services/video-frame-interpolation-api:services/video-mcp-server python -m unittest discover -s services/video-mcp-server/integration -v
      - run: python -m pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install rotary-embedding-torch==0.5.3 einops==0.7.0
      - run: PYTHONPATH=services/video-super-resolution-api python -m unittest discover -s services/video-super-resolution-api/tests -v
      - run: python -m compileall -q services/${SERVICE}
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          echo "registry_endpoint=${registry_endpoint}" >> "$GITHUB_OUTPUT"
          echo "name=${registry_endpoint}/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
          echo "version=${SERVICE}-v${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing image tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" > /tmp/image-inspect.log 2>&1; then
            echo "Refusing to overwrite an existing release"
            exit 1
          fi
          grep -Eqi 'manifest unknown|not found' /tmp/image-inspect.log || { echo "Registry preflight failed"; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          file: services/${{ env.SERVICE }}/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
