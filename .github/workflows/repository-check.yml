name: Video Repository Checks
on:
  push:
    branches: [release]
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce repository boundaries and source-only delivery
        shell: bash
        run: |
          set -euo pipefail
          test ! -d docs
          test ! -d deploy
          test ! -d deploys
          test ! -d services/video-minimax-h3-lightx2v-benchmark
          test ! -d services/video-minimax-h3-sglang-benchmark
          test ! -f .github/workflows/video-minimax-h3-lightx2v-benchmark.yml
          test ! -f .github/workflows/video-minimax-h3-sglang-benchmark.yml
          if git ls-files | grep -Ei '\.(mp4|mov|avi|mkv|webm|m4v|mpg|mpeg|wmv|flv|mp3|wav|flac|aac|m4a|ogg|opus|wma|aiff|safetensors|ckpt|pt|pth)$'; then
            echo 'Media and model weights must stay outside Git.' >&2
            exit 1
          fi
          git diff --check
