name: VDN H3 Release
on:
  push:
    branches: [release]
    paths:
      [
        services/video-minimax-h3-vdn/**,
        .github/workflows/video-minimax-h3-vdn.yml,
      ]
permissions:
  contents: read
concurrency:
  group: video-minimax-h3-vdn-release
  cancel-in-progress: false
env:
  SERVICE: video-minimax-h3-vdn
  VERSION: 0.3.11
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Contract tests
        run: |
          python3 -m unittest discover -s services/${SERVICE}/tests -v
          python3 -m compileall -q services/${SERVICE}
      - name: Verify project configuration
        run: |
          python3 -c 'import os, pathlib, re, tomllib; p = pathlib.Path("services") / os.environ["SERVICE"] / "pyproject.toml"; config = tomllib.loads(p.read_text()); upstream = config["tool"]["vdn"]["upstream"]; assert upstream["repository"]; assert all(re.fullmatch("[0-9a-f]{40}", upstream[k]) for k in ("commit", "diffusers_commit"))'
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: check
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          set -euo pipefail
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          test -n "${registry_endpoint}"
          echo "registry_endpoint=${registry_endpoint}" >> "$GITHUB_OUTPUT"
          echo "name=${registry_endpoint}/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
          echo "version=${SERVICE}-v${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing image tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" > /tmp/image-inspect.log 2>&1; then
            echo "Refusing to overwrite an existing release"
            exit 1
          fi
          grep -Eqi 'manifest unknown|not found' /tmp/image-inspect.log || { echo "Registry preflight failed"; exit 1; }
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: services/${{ env.SERVICE }}
          file: services/${{ env.SERVICE }}/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          push: true
          provenance: false
          sbom: false
      - name: Verify published manifest
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
